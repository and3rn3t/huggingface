name: E2E Tests (Scheduled)

on:
  schedule:
    - cron: "0 2 * * *" # nightly 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    continue-on-error: true # nightly signal, not a gate
    uses: and3rn3t/.github/.github/workflows/reusable-playwright-e2e.yml@main
    with:
      command: npm run test:e2e
      browsers: chromium firefox webkit
      timeout-minutes: 60
