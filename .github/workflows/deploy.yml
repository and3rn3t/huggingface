name: Deploy to Cloudflare Pages

# Quality gates (lint/type-check/test) run in ci.yml — this workflow only builds and deploys.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: and3rn3t/.github/.github/workflows/reusable-cloudflare-pages-deploy.yml@v1
    with:
      project-name: hug
      build-secret-env-name: VITE_HF_TOKEN
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUILD_SECRET: ${{ secrets.VITE_HF_TOKEN }}
